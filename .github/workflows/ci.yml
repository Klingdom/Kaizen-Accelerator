name: ci

# Run tests on every PR and every push to main. Zero external deps —
# uses Node's built-in test runner per the repo's MVP tech constraint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify no external dependencies
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            echo "ERROR: MVP must not introduce external runtime dependencies."
            exit 1
          fi
          if grep -q '"dependencies"\s*:' package.json 2>/dev/null; then
            echo "ERROR: package.json declared runtime dependencies; MVP is zero-dep."
            exit 1
          fi

      - name: Run tests
        run: npm test

  docker-build:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bamx/web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
