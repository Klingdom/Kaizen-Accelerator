name: deploy

# Deploy to Hostinger VPS on push to main after CI passes.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   HOSTINGER_HOST         — the VPS IP or hostname, e.g. 1.2.3.4
#   HOSTINGER_USER         — SSH user on the VPS (typically root or a deploy user)
#   HOSTINGER_SSH_KEY      — the private SSH key (PEM format); add the matching
#                            public key to ~/.ssh/authorized_keys on the VPS
#   HOSTINGER_DEPLOY_PATH  — absolute path on the VPS where the repo lives,
#                            e.g. /opt/bamx
#
# First-time VPS setup is documented in README.md "Deployment" section.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-deploy button in GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ssh → git pull → compose up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate deploy on CI passing. This job only runs if the CI workflow green-lit
    # the same SHA; we rely on branch protection requiring CI to pass before merge.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          known_hosts: 'placeholder'
          if_key_exists: replace

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" bash -s <<'ENDSSH'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "==> Fetch latest main"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Build and start containers"
          docker compose pull --ignore-buildable
          docker compose up -d --build --remove-orphans

          echo "==> Prune stopped containers + dangling images"
          docker container prune -f
          docker image prune -f

          echo "==> Health check"
          sleep 5
          if curl -fsS http://localhost/health >/dev/null; then
            echo "✔ deploy healthy"
          else
            echo "✗ health check failed" >&2
            docker compose logs --tail=100 web
            exit 1
          fi
          ENDSSH

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Deploy failed::Check the VPS logs: ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} -- docker compose -f ${{ secrets.HOSTINGER_DEPLOY_PATH }}/docker-compose.yml logs web"
