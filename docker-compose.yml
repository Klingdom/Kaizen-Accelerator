# BAM-X Kaizen OS — docker-compose orchestration
#
# Run locally:   DOMAIN=localhost docker compose up --build
# Run on VPS:    DOMAIN=kaizen.example.com ACME_EMAIL=you@example.com \
#                docker compose up -d --build
#
# The `web` service is the only active service in MVP. The `db` service is
# commented out and ready to uncomment when Sprint 5+ moves data off
# localStorage per ARCHITECTURE.md §7.3.

name: bamx

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # No `image:` — compose builds locally only. Setting image:bamx/web:latest
    # caused Hostinger's panel to try Docker Hub pulls on redeploy (bamx/web
    # doesn't exist there), failing before the local build could run.
    container_name: bamx-web
    restart: unless-stopped
    ports:
      # Host-side ports default to 8080 / 8443 so bamx can co-exist with other
      # projects on a shared VPS without colliding on 80 / 443. The container
      # ALWAYS listens on 80 / 443 internally; only the host binding changes.
      #
      # Override via a committed .env file at the repo root if you want
      # different host ports (e.g., HTTP_PORT_HOST=80 for dedicated VPSes):
      #   echo 'HTTP_PORT_HOST=80' > .env
      #   echo 'HTTPS_PORT_HOST=443' >> .env
      # Hostinger panel env vars become CONTAINER env vars, not shell-scope
      # vars for compose substitution, so they cannot change host ports.
      - "${HTTP_PORT_HOST:-8090}:80"
      - "${HTTPS_PORT_HOST:-8443}:443"
    environment:
      # DOMAIN=localhost disables TLS; DOMAIN=<real-domain> enables auto-HTTPS.
      # NOTE: Caddy's automatic Let's Encrypt HTTP-01 / TLS-ALPN-01 challenges
      # require the public internet to reach THIS container on ports 80 / 443.
      # If you have bamx on alt host ports (e.g., 8080 / 8443), you MUST front
      # it with a host-level reverse proxy that terminates TLS and routes by
      # Host header, OR switch Caddy to the ACME DNS-01 challenge. See README
      # "Multi-project deployment" for both patterns.
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
    volumes:
      # Persist Caddy's Let's Encrypt certs and state across rebuilds.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bamx-net

  # ─────────────────────────────────────────────────────────────────────────
  # Uncomment when MVP graduates to the future-state architecture per
  # ARCHITECTURE.md §7.3. The entity schema in js/domain/types.js already
  # ports cleanly to this database (port-compat rule, ARCHITECTURE §7.2).
  # ─────────────────────────────────────────────────────────────────────────
  # db:
  #   image: postgres:16-alpine
  #   container_name: bamx-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-bamx}
  #     POSTGRES_USER: ${POSTGRES_USER:-bamx}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #   volumes:
  #     - bamx_pg:/var/lib/postgresql/data
  #     # Schema migrations land here when Sprint 5+ authors them.
  #     - ./db/migrations:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bamx}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - bamx-net
  #   # Do NOT expose ports to the host in production; only the Node/Next.js
  #   # app service (future) will talk to Postgres over the internal network.

volumes:
  caddy_data:
  caddy_config:
  # bamx_pg:

networks:
  bamx-net:
    driver: bridge
